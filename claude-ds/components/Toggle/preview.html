<!-- @dsCard group="🟡 Beta" subtitle="Selection · Status × Size × Control" height=330 -->
<div class="emcd" style="display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--surface-level-0, var(--bg-base))">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:360px">
    <label class="emcd-toggle"><input type="checkbox" role="switch" checked><span class="emcd-toggle__text"><span>Автовывод</span><span class="emcd-toggle__desc">Каждый день при балансе от 0,001 BTC</span></span></label>
    <label class="emcd-toggle"><input type="checkbox" role="switch"><span class="emcd-toggle__text"><span>Уведомления о выплатах</span></span></label>
    <label class="emcd-toggle"><input type="checkbox" role="switch" disabled><span class="emcd-toggle__text"><span>Merged-майнинг</span><span class="emcd-toggle__desc">Недоступно для этой монеты</span></span></label>
    <label class="emcd-toggle"><input type="checkbox" role="switch" checked disabled><span class="emcd-toggle__text"><span>Подтверждение по почте</span></span></label>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-start">
    <label class="emcd-toggle emcd-toggle--s" style="width:240px"><input type="checkbox" role="switch" checked><span class="emcd-toggle__text"><span>S — плотные списки</span></span></label>
    <label class="emcd-toggle emcd-toggle--start"><input type="checkbox" role="switch" checked><span class="emcd-toggle__text"><span>Control position = Start</span></span></label>
    <label class="emcd-toggle emcd-toggle--s emcd-toggle--start"><input type="checkbox" role="switch"><span class="emcd-toggle__text"><span>S · Start</span></span></label>
  </div>
</div>
