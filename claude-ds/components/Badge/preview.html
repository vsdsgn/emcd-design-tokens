<div class="emcd" style="display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--surface-level-0, var(--bg-base))">

    <span class="emcd-badge"><span class="emcd-badge__label">Черновик</span></span>

    <span class="emcd-badge emcd-badge--success"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg><span class="emcd-badge__label">Выплачено</span></span>

    <span class="emcd-badge emcd-badge--info"><span class="emcd-badge__label">Обновление</span></span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <span class="emcd-badge emcd-badge--solid"><span class="emcd-badge__label">Beta</span></span>
    <span class="emcd-badge emcd-badge--solid emcd-badge--accent"><span class="emcd-badge__label">Новое</span></span>

    <span class="emcd-badge emcd-badge--solid emcd-badge--warning"><span class="emcd-badge__label">Нестабилен</span></span>

    <span class="emcd-badge emcd-badge--solid emcd-badge--info"><span class="emcd-badge__label">Инфо</span></span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <span class="emcd-badge emcd-badge--s emcd-badge--success"><span class="emcd-badge__label">S 20</span></span>
    <span class="emcd-badge emcd-badge--success"><span class="emcd-badge__label">M 24</span></span>
    <span class="emcd-badge emcd-badge--l emcd-badge--success"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg><span class="emcd-badge__label">L 32</span></span>

    <span class="emcd-badge emcd-badge--info"><span class="emcd-badge__label">BTC · TRC20</span><button class="emcd-badge__close" aria-label="Убрать «BTC · TRC20»"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></span>
