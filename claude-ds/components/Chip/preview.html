<!-- @dsCard group="🟡 Beta" subtitle="Selection · Size × Selected" height=220 -->
<div class="emcd" style="display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--surface-level-0, var(--bg-base))">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <button class="emcd-chip" aria-pressed="true"><span class="emcd-chip__label">Онлайн</span><span class="emcd-chip__meta">128</span></button>
    <button class="emcd-chip" aria-pressed="false"><span class="emcd-chip__label">Офлайн</span><span class="emcd-chip__meta">4</span></button>
    <button class="emcd-chip" aria-pressed="false"><span class="emcd-chip__label">Нестабильные</span></button>
    <button class="emcd-chip" aria-pressed="false" disabled><span class="emcd-chip__label">За 30 дней</span></button>
    <button class="emcd-chip" aria-pressed="false" title="Воркеры с хешрейтом ниже среднего за неделю"><span class="emcd-chip__label">Воркеры с хешрейтом ниже среднего за неделю</span></button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <span class="emcd-chip emcd-chip--selected"><button class="emcd-chip__action" aria-pressed="true"><span class="emcd-chip__label">Сеть: TRC20</span></button><button class="emcd-chip__remove" aria-label="Убрать фильтр «Сеть: TRC20»"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></span>
    <span class="emcd-chip emcd-chip--selected"><button class="emcd-chip__action" aria-pressed="true"><span class="emcd-chip__label">Монета: BTC</span></button><button class="emcd-chip__remove" aria-label="Убрать фильтр «Монета: BTC»"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></button></span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <button class="emcd-chip emcd-chip--m" aria-pressed="false"><span class="emcd-chip__label">90 дней</span><span class="emcd-chip__meta">6 %</span></button>
    <button class="emcd-chip emcd-chip--m" aria-pressed="true"><span class="emcd-chip__label">180 дней</span><span class="emcd-chip__meta">8 %</span></button>
    <button class="emcd-chip emcd-chip--m" aria-pressed="false"><span class="emcd-chip__label">360 дней</span><span class="emcd-chip__meta">10 %</span></button>
  </div>
</div>
